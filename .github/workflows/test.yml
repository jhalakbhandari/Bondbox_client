name: Run Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -d "Bondbox_client" ]; then
            cd Bondbox_client && npm ci || npm install
          else
            npm ci || npm install
          fi

      - name: Run tests
        run: |
          if [ -d "Bondbox_client" ]; then
            cd Bondbox_client && npm test
          else
            npm test
          fi
